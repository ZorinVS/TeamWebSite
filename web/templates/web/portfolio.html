{% extends 'web/base.html' %}

{% block title %}Наши проекты{% endblock %}

{% block content %}
<section class="py-20 bg-gray-50">
    <div class="max-w-6xl mx-auto px-4">
        <h1 class="text-4xl font-bold mb-8">Наши работы</h1>
        <div class="grid md:grid-cols-3 gap-8">
            {% for item in works %}
                <div class="bg-white rounded-xl overflow-hidden shadow hover:shadow-xl transition">
                    <img src="{{ item.image.url }}" alt="{{ item.title }}" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <h3 class="text-xl font-semibold">{{ item.title }}</h3>
                        <p class="text-gray-600 text-sm">{{ item.description }}</p>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
