{% extends 'web/base.html' %}
{% block title %}Решения для бизнеса{% endblock %}
{% block content %}
<h2 class="text-3xl font-bold text-center mb-6">Лучшие решения для бизнеса</h2>
<div class="max-w-4xl mx-auto space-y-6">
  {% for post in posts %}
    <div class="bg-white p-6 rounded shadow">
      <h3 class="text-xl font-semibold mb-2">{{ post.title }}</h3>
      <p>{{ post.content }}</p>
      <p class="text-sm text-gray-500 mt-2">{{ post.created_at|date:"d.m.Y" }}</p>
    </div>
  {% empty %}
    <p class="text-center text-gray-500">Пока нет записей.</p>
  {% endfor %}
</div>
{% endblock %}
