<!DOCTYPE html>
<html lang="ru">
{% load static %}
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}AI-решения и боты под ключ{% endblock %}</title>
    <meta name="description" content="Создаём AI-агентов и Telegram-ботов на Python, Django, FastAPI. Современные IT-решения для бизнеса." />
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}" />
    <script defer src="{% static 'js/main.js' %}"></script>
</head>
<body class="bg-white text-gray-800 scroll-smooth">

    <!-- Навигация -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-indigo-600">Autelix</a>
            <nav class="space-x-6">
                <a href="/" class="hover:text-indigo-600 transition">Главная</a>
                <a href="/solutions/" class="hover:text-indigo-600 transition">Решения</a>
                <a href="/portfolio/" class="hover:text-indigo-600 transition">Наши работы</a>
                <a href="/contacts/" class="hover:text-indigo-600 transition">Контакты</a>
            </nav>
        </div>
    </header>

    <!-- Контент -->
    <main class="min-h-screen">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Футер -->
    <footer class="bg-gray-900 text-white py-6">
        <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center text-sm">
            <p>&copy; 2025 Autelix. Все права защищены.</p>
            <div class="space-x-4 mt-2 md:mt-0">
                <a href="https://t.me/yourcompany" class="hover:text-indigo-400">Telegram</a>
                <a href="mailto:info@autelix.dev" class="hover:text-indigo-400">info@autelix.dev</a>
            </div>
        </div>
    </footer>

</body>
</html>
