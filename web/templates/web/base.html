<!DOCTYPE html>
<html lang="ru">
{% load static %}
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}AI-решения и боты под ключ{% endblock %}</title>
    <meta name="description" content="Создаём AI-агентов и Telegram-ботов на Python, Django, FastAPI. Современные IT-решения для бизнеса." />
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}" />
    <script defer src="{% static 'js/menu_toggle.js' %}"></script>
    <script defer src="{% static 'js/views_feedback_in_index.js' %}"></script>
</head>
<body class="flex flex-col min-h-screen bg-white text-gray-800 scroll-smooth">

    <!-- Навигация -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center relative">
            <a href="/" class="text-2xl font-bold text-indigo-600">Autelix</a>

            <!-- ПК-меню (отображается только на md и выше) -->
            <nav class="hidden md:flex space-x-6">
                <a href="/" class="hover:text-indigo-600 transition">Главная</a>
                <a href="/solutions/" class="hover:text-indigo-600 transition">Блог</a>
                <a href="/portfolio/" class="hover:text-indigo-600 transition">Наши решения</a>
                <a href="/contacts/" class="hover:text-indigo-600 transition">Оставить заявку</a>
            </nav>

            <!-- Бургер-кнопка (только для мобилки) -->
            <button id="burger" class="md:hidden text-4xl font-bold transition-transform duration-300 transform rotate-0 z-50">
                +
            </button>
        </div>

        <!-- Мобильное меню (только на мобильных) -->
        <nav id="mobileMenu" class="md:hidden max-h-0 overflow-hidden opacity-0 pointer-events-none transition-all duration-300 ease-in-out flex flex-col bg-white shadow-md px-6 py-4 space-y-3">
            <a href="/" class="block hover:text-indigo-600 transition">Главная</a>
            <a href="/solutions/" class="block hover:text-indigo-600 transition">Блог</a>
            <a href="/portfolio/" class="block hover:text-indigo-600 transition">Наши решения</a>
            <a href="/contacts/" class="block hover:text-indigo-600 transition">Оставить заявку</a>
        </nav>
    </header>

    <!-- Контент -->
    <main class="flex-grow">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Футер -->
    <footer class="bg-gray-900 text-white py-6 relative z-50">
        <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center text-sm">
            <p>&copy; 2025 Autelix. Все права защищены.</p>
            <div class="space-x-4 mt-2 md:mt-0">
                <a href="https://t.me/itso_webdev" class="hover:text-indigo-400">Telegram</a>
                <a href="mailto:info@autelix.dev" class="hover:text-indigo-400">info@autelix.dev</a>
            </div>
        </div>
    </footer>

</body>
</html>
