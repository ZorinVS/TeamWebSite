<form id="contact-form" class="space-y-6">
  {% csrf_token %}
  <h2 class="text-2xl font-bold text-gray-800 text-center">Оставьте заявку</h2>

  <div>
    <label class="block text-sm text-gray-600 mb-1">Ваше имя</label>
    <input type="text" name="name" required
      class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-white/70 backdrop-blur-sm placeholder-gray-400 focus:ring-2 focus:ring-indigo-400 focus:outline-none transition" placeholder="Введите имя" />
  </div>

  <div>
    <label class="block text-sm text-gray-600 mb-1">Email</label>
    <input type="email" name="email" required
      class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-white/70 backdrop-blur-sm placeholder-gray-400 focus:ring-2 focus:ring-indigo-400 focus:outline-none transition" placeholder="Введите email" />
  </div>

  <div>
    <label class="block text-sm text-gray-600 mb-1">Сообщение</label>
    <textarea name="message" rows="4" required
      class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-white/70 backdrop-blur-sm placeholder-gray-400 focus:ring-2 focus:ring-indigo-400 focus:outline-none transition"
      placeholder="Введите сообщение..."></textarea>
  </div>

  <button type="submit"
    class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl shadow hover:bg-indigo-700 transition">
    Отправить
  </button>

  <div id="form-message" class="mt-4 hidden text-green-600 font-semibold text-center"></div>
</form>
