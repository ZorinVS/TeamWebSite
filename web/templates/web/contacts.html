{% extends 'web/base.html' %}

{% block title %}Свяжитесь с нами{% endblock %}

{% block content %}
<section class="py-20">
    <div class="max-w-xl mx-auto px-4">
        <h1 class="text-4xl font-bold mb-6">Оставьте заявку</h1>
        <form method="post" action="" class="space-y-4">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div>
                <label class="block font-medium">Ваше имя</label>
                {{ form.name|add_class:'w-full p-3 border rounded-xl' }}
            </div>
            <div>
                <label class="block font-medium">Email</label>
            </div>
            <div>
                <label class="block font-medium">Сообщение</label>
                {{ form.message|add_class:'w-full p-3 border rounded-xl h-32' }}
            </div>
            <button type="submit" class="bg-indigo-600 text-white py-3 px-6 rounded-xl hover:bg-indigo-700 transition">
                Отправить
            </button>
        </form>
    </div>
</section>
{% endblock %}
