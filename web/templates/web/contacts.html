{% extends 'web/base.html' %}
{% load static %}

{% block title %}Свяжитесь с нами{% endblock %}

{% block content %}
<section class="py-20 animate-fade-in">
  <div class="max-w-xl mx-auto px-4">
    <h1 class="text-4xl font-bold mb-6">Оставьте заявку</h1>
    <form id="contact-form" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block font-medium">Ваше имя</label>
        <input type="text" name="name" required class="w-full p-3 border rounded-xl" />
      </div>
      <div>
        <label class="block font-medium">Email</label>
        <input type="email" name="email" required class="w-full p-3 border rounded-xl" />
      </div>
      <div>
        <label class="block font-medium">Сообщение</label>
        <textarea name="message" required class="w-full p-3 border rounded-xl h-32"></textarea>
      </div>
      <button type="submit" class="bg-indigo-600 text-white py-3 px-6 rounded-xl hover:bg-indigo-700 transition">
        Отправить
      </button>
    </form>

    <div id="form-message" class="mt-4 hidden text-green-600 font-semibold"></div>
  </div>
</section>
{% endblock %}

{% block scripts %}
  <script src="{% static 'js/contact_form.js' %}"></script>
{% endblock %}
